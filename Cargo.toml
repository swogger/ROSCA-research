[package]
name = "breaking-binary"
version = "0.1.0"
edition = "2021"
description = "Analysis code for a study of payout-date choice in fixed-term financing subscriptions"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
